<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - Lurkr</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header>
      <nav class="container nav">
        <a href="../" class="logo">Lurkr</a>
        <div class="nav-links" id="nav-links"></div>
      </nav>
    </header>

    <main class="container" id="main">
      <div class="form-wrapper">
        <h1>Log in</h1>

        <form id="login-form" class="flex flex-col gap-4">
          <div class="flex flex-col gap-4">
            <label for="email" class="text-sm font-medium">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="name@stud.noroff.no"
              class="rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary user-invalid:border-red-500"
            />
            <small class="text-xs">Must be a @stud.noroff.no address</small>
          </div>

          <div class="flex flex-col gap-4">
            <label for="password" class="text-sm font-medium">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="8"
              class="rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary user-invalid:border-red-500"
            />
            <small class="text-xs">At least 8 characters</small>
          </div>

          <div
            id="error-message"
            class="text-xs text-red-500"
            aria-live="polite"
          ></div>
          <div
            id="success-message"
            class="text-xs text-green-500"
            aria-live="polite"
          ></div>

          <button
            type="submit"
            class="bg-primary text-white rounded-lg px-3 py-2 cursor-pointer hover:bg-accent"
          >
            Log in
          </button>
        </form>

        <p class="form-footer">
          Don't have an account? <a href="./register.html">Register</a>
        </p>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Lurkr</p>
    </footer>

    <script type="module" src="../js/nav.ts"></script>
    <script type="module" src="../js/login.ts"></script>
  </body>
</html>
