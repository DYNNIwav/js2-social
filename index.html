<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed - Lurkr</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header>
      <nav class="container nav">
        <a href="./" class="logo">Lurkr</a>
        <div class="nav-links" id="nav-links"></div>
      </nav>
    </header>

    <main class="container" id="main">
      <section>
        <div
          class="my-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
        >
          <h1>Feed</h1>
          <input
            type="search"
            id="search-input"
            placeholder="Search posts..."
            class="rounded-lg border border-border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary sm:w-64"
          />
        </div>
        <div
          id="posts"
          class="max-w-2xl mx-auto"
        >
          <div class="loading"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Lurkr</p>
    </footer>

    <script type="module" src="./js/nav.ts"></script>
    <script type="module" src="./js/feed.ts"></script>
  </body>
</html>
